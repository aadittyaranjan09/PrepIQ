name: CI — Build & Test

on:
  push:
    branches: [main, dev, develop]
  pull_request:
    branches: [main, dev, develop]

jobs:
  build-and-test:
    name: Build & Test Single-Service PrepIQ
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies (Backend + Frontend)
        run: |
          npm ci || npm install
          npm --prefix Frontend ci || npm --prefix Frontend install

      - name: Build frontend production bundle
        run: npm run build

      - name: Syntax check server entry point and backend files
        run: |
          node --check server.js
          node --check Backend/server.js
          node --check Backend/src/app.js
          find Backend/src -name "*.js" -exec node --check {} \;

      - name: Run test suite
        run: npm test
