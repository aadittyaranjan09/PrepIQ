name: Deploy → Render Web Service

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Trigger Render Deploy Hook
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check required secrets
        id: check-secrets
        shell: bash
        run: |
          if [ -z "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Trigger Render Deploy Hook
        if: steps.check-secrets.outputs.skip == 'false'
        shell: bash
        run: |
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${{ secrets.RENDER_DEPLOY_HOOK_URL }}")
          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "✅ Render single-service deploy triggered — HTTP $HTTP_STATUS"
          else
            echo "❌ Render deploy hook returned HTTP $HTTP_STATUS"
            exit 1
          fi

      - name: Deploy skipped notice
        if: steps.check-secrets.outputs.skip == 'true'
        run: |
          echo "RENDER_DEPLOY_HOOK_URL is not set. Render will use Git auto-deploy on push."
